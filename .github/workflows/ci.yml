name: CodeNibbl CI (Typecheck, Security & Unit Tests)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Run Unit & Security Guardrail Tests
        run: npm test

      - name: Verify Production Bundle
        run: npm run compile -- --production
